<div class="device-modal-overlay" id="deviceModalOverlay" hidden>
  <div class="device-modal" role="dialog" aria-modal="true" aria-labelledby="deviceModalTitle">
    <button class="device-modal-close" id="deviceModalClose" type="button" aria-label="Close">×</button>
    <h2 id="deviceModalTitle">Device</h2>
    <ul id="deviceModalBody" class="device-modal-list"></ul>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const overlay = document.getElementById('deviceModalOverlay');
    const title = document.getElementById('deviceModalTitle');
    const body = document.getElementById('deviceModalBody');
    const closeBtn = document.getElementById('deviceModalClose');
    const languageOverlay = document.getElementById('languageModalOverlay');
    const languageButtons = document.querySelectorAll('.language-choice-btn');

    const closeModal = () => {
      overlay.hidden = true;
      document.body.classList.remove('device-modal-open');
    };

    const closeLanguageModal = () => {
      languageOverlay.hidden = true;
      document.body.classList.remove('device-modal-open');
    };

    const hasSeenLanguagePrompt = localStorage.getItem('site-language-prompt-seen');
    if (!hasSeenLanguagePrompt) {
      languageOverlay.hidden = false;
      document.body.classList.add('device-modal-open');
    }

    languageButtons.forEach((button) => {
      button.addEventListener('click', () => {
        localStorage.setItem('site-language-prompt-seen', 'true');
        localStorage.setItem('site-language', button.dataset.lang || 'en');
        closeLanguageModal();
      });
    });

    document.querySelectorAll('.device-card-trigger').forEach((trigger) => {
      trigger.addEventListener('click', (event) => {
        event.preventDefault();
        title.textContent = trigger.dataset.deviceTitle || 'Device';
        const rawContent = trigger.dataset.deviceContent || 'placeholder';
        const items = rawContent.split(',').map((item) => item.trim()).filter(Boolean);
        body.innerHTML = '';
        items.forEach((item) => {
          const li = document.createElement('li');
          li.textContent = item;
          body.appendChild(li);
        });

        const linksData = trigger.dataset.deviceLinks || '';
        if (linksData) {
          try {
            const links = JSON.parse(linksData);
            links.forEach((link) => {
              const li = document.createElement('li');
              li.innerHTML = `<a href="${link.url}" target="_blank" rel="noopener noreferrer">${link.label}</a>`;
              body.appendChild(li);
            });
          } catch (error) {
            const li = document.createElement('li');
            li.textContent = 'Link unavailable';
            body.appendChild(li);
          }
        }
        overlay.hidden = false;
        document.body.classList.add('device-modal-open');
      });
    });

    closeBtn.addEventListener('click', closeModal);
    overlay.addEventListener('click', (event) => {
      if (event.target === overlay) {
        closeModal();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !overlay.hidden) {
        closeModal();
      }
    });
  });
</script>
