<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jpedro's Website - Files</title>
  <link href="/scripts/style.css" rel="stylesheet" type="text/css" media="all">
  <link rel="icon" href="/images/site icon.ico">
  <script src="/scripts/settings.js"></script>
  <script src="/br/scripts/files.js" defer></script>
</head>
<body class="files-page">
  <div class="topnav">
    <a class="active" href="/" data-full-label="🏠" data-minimized-label="🏠">🏠</a>
    <a href="/devices.html" data-full-label="Dispositivos" data-minimized-label="📱">Dispositivos</a>
    <a href="/files.html" data-full-label="Arquivos" data-minimized-label="📁">Arquivos</a>
    <a href="/minecraft%20server.html" data-full-label="Minecraft" data-minimized-label="⛏️">Minecraft</a>
    <a href="/settings.html" data-full-label="Config." data-minimized-label="⚙️">Config.</a>
    <a class="minimize-btn" id="minimizeBtn" title="Minimize">−</a>
  </div>

  <div class="main">
    <div class="card-bg" style="padding:18px 22px; width:min(1100px,94vw); box-sizing:border-box;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <div>
          <h1 style="margin:6px 0 2px 0;">Arquivos</h1>
          <p style="margin:0;opacity:0.8">Seleção de arquivos que achei legal e botei aqui. O servidor não está ligado. Eu não achei uma forma de hostear sem comprar um domínio.</p>
        </div>
        <input id="search" class="file-search" placeholder="Escreva para pesquisar...">
      </div>

      <div class="card-bg" style="padding:12px; margin-top:12px; width:100%; box-sizing:border-box; background: rgba(0,0,0,0.6);">
        <div style="display:flex;align-items:center;gap:10px;margin-top:0;margin-bottom:12px;color:var(--muted-color,#caced6);">
          <a href="/" style="text-decoration:none;">🏠</a>
          <span>/</span>
        </div>

        <div class="file-list-container" style="overflow:auto">
        <table class="file-table" style="width:100%;border-collapse:collapse;">
          <thead>
            <tr style="text-align:left;opacity:0.9;border-bottom:1px solid rgba(255,255,255,0.06);">
              <th style="padding:10px 8px">Nome</th>
              <th style="padding:10px 8px;width:110px">Tamanho</th>
              <th style="padding:10px 8px;width:160px">Data</th>
            </tr>
          </thead>
          <tbody id="file-list">
            <tr><td colspan="3" style="padding:18px 8px;opacity:0.8">Carregando arquivos..</td></tr>
          </tbody>
        </table>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
